# Render Blueprint: create a Blueprint from this repository to apply these settings.
services:
  - type: web
    name: jayce-yap-life-planner
    runtime: static
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
